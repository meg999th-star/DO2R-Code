<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบกรอกโค้ดรับรางวัล</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2d2d2d;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            margin-top: 0;
            color: #4CAF50;
        }
        .input-group {
            margin: 20px 0;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #444;
            border-radius: 6px;
            background-color: #1a1a1a;
            color: #fff;
            font-size: 16px;
            text-transform: uppercase; /* แสดงเป็นตัวพิมพ์ใหญ่ */
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #4CAF50;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        /* สำหรับแสดงผลลัพธ์ */
        #resultMessage {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            display: none; /* ซ่อนไว้ก่อน พอกดปุ่มค่อยแสดง */
        }
        .success {
            background-color: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            border: 1px solid #4CAF50;
        }
        .error {
            background-color: rgba(244, 67, 54, 0.2);
            color: #f44336;
            border: 1px solid #f44336;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>กรอกโค้ดเพื่อรับรางวัล</h2>
        <div class="input-group">
            <input type="text" id="codeInput" placeholder="กรอกโค้ดที่นี่..." autocomplete="off">
        </div>
        <button onclick="checkCode()">ยืนยันโค้ด</button>
        
        <!-- กล่องแสดงข้อความผลลัพธ์ -->
        <div id="resultMessage"></div>
    </div>

    <script>
        // กำหนดรายการโค้ดและข้อความที่จะให้แสดง
        const codeList = {
            "DO2R": "❌ code หมดอายุแล้ว",
            "SFN": "🎉 ยินดีต้อนรับ! คุณได้รับ 50 Robux เรียบร้อยแล้ว",
            "1987": "🎉 ยินดีต้อนรับ! คุณได้รับ 1 Robux เรียบร้อยแล้ว",
        };

        function checkCode() {
            // รับค่าจากช่อง input และตัดช่องว่างออก แปลงเป็นตัวพิมพ์ใหญ่
            const inputCode = document.getElementById("codeInput").value.trim().toUpperCase();
            const messageBox = document.getElementById("resultMessage");

            // ล้างคลาสเก่าออกก่อน
            messageBox.className = "";

            if (inputCode === "") {
                messageBox.innerHTML = "กรุณากรอกโค้ดก่อนทำการยืนยัน";
                messageBox.classList.add("error");
                messageBox.style.display = "block";
                return;
            }

            // ตรวจสอบว่าโค้ดตรงกับในรายการหรือไม่
            if (codeList.hasOwnProperty(inputCode)) {
                // หากกรอกถูก
                messageBox.innerHTML = codeList[inputCode];
                messageBox.classList.add("success");
            } else {
                // หากกรอกผิด
                messageBox.innerHTML = "❌ โค้ดไม่ถูกต้อง หรือถูกใช้งานไปแล้ว";
                messageBox.classList.add("error");
            }

            // แสดงกล่องข้อความ
            messageBox.style.display = "block";
        }
    </script>

</body>
</html>
